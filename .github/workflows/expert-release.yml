name: Expert Release Gate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONPYCACHEPREFIX: /tmp/crossborder-decision-lab-pycache
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install locked validation dependencies
        run: python3 -m pip install -r requirements-dev.txt
      - name: Compile deterministic tools
        run: python3 -m compileall -q category-investment-decision competitive-intelligence-monitoring video-link-breakdown consumer-insights-customer-growth advertising-analysis-measurement-optimization logistics-inventory-fulfillment-decision platform-store-listing-conversion creator-affiliate-partnership-management marketing-brand-campaign-management pricing-profit-finance-cashflow-decision product-innovation-product-management supplier-procurement-production-quality-decision legal-tax-intellectual-property-market-access-decision governance/interaction governance/platform-knowledge governance/connectors scripts
      - name: Domain model tests
        run: |
          python3 category-investment-decision/scripts/test_models.py
          python3 category-investment-decision/scripts/test_decision_contract.py
          python3 category-investment-decision/scripts/test_report_lineage.py
          python3 video-link-breakdown/scripts/test_prepare_video_link.py
          python3 video-link-breakdown/scripts/test_vlb_frameworks.py
          python3 competitive-intelligence-monitoring/scripts/test_monitoring.py
          python3 consumer-insights-customer-growth/scripts/test_growth.py
          python3 advertising-analysis-measurement-optimization/scripts/test_models.py
          python3 advertising-analysis-measurement-optimization/scripts/test_causal_measurement.py
          python3 logistics-inventory-fulfillment-decision/scripts/test_models.py
          python3 logistics-inventory-fulfillment-decision/scripts/test_executable_fixtures.py
          python3 logistics-inventory-fulfillment-decision/scripts/test_decision_state.py
          python3 logistics-inventory-fulfillment-decision/scripts/test_cross_skill_complex.py
          python3 logistics-inventory-fulfillment-decision/scripts/test_multiturn_report.py
          python3 logistics-inventory-fulfillment-decision/scripts/test_historical_replay.py
          python3 marketing-brand-campaign-management/scripts/test_mbcm.py
          python3 marketing-brand-campaign-management/scripts/test_marketing_science.py
          python3 pricing-profit-finance-cashflow-decision/scripts/test_structure_contract.py
          python3 pricing-profit-finance-cashflow-decision/scripts/test_pricing_models.py
          python3 pricing-profit-finance-cashflow-decision/scripts/test_cross_domain_contract.py
          python3 pricing-profit-finance-cashflow-decision/scripts/test_localization_contract.py
          python3 pricing-profit-finance-cashflow-decision/scripts/test_output_continuity.py
          python3 pricing-profit-finance-cashflow-decision/scripts/test_mixed_batch_economics.py
          python3 pricing-profit-finance-cashflow-decision/scripts/test_evaluation_catalog.py
          python3 pricing-profit-finance-cashflow-decision/scripts/test_business_model_scenarios.py
          python3 pricing-profit-finance-cashflow-decision/scripts/test_evaluation_execution.py
          python3 pricing-profit-finance-cashflow-decision/scripts/test_migration_compatibility.py
          python3 pricing-profit-finance-cashflow-decision/scripts/test_consumer_adapters.py
          python3 pricing-profit-finance-cashflow-decision/scripts/test_consumer_financial_boundaries.py
          python3 pricing-profit-finance-cashflow-decision/scripts/test_acceptance_and_release.py
          python3 pricing-profit-finance-cashflow-decision/scripts/test_l3_audit_matrix.py
          python3 pricing-profit-finance-cashflow-decision/scripts/validate_l3_audit.py
          python3 pricing-profit-finance-cashflow-decision/scripts/test_historical_replay.py
          python3 pricing-profit-finance-cashflow-decision/scripts/validate_structure_contract.py
          python3 product-innovation-product-management/scripts/validate_wp2_structure.py
          python3 product-innovation-product-management/scripts/test_wp2_contracts.py
          python3 product-innovation-product-management/scripts/test_wp3_package.py
          python3 product-innovation-product-management/scripts/test_product_models.py
          python3 product-innovation-product-management/scripts/test_wp5_cross_domain.py
          python3 product-innovation-product-management/scripts/test_wp6_expert_contracts.py
          python3 product-innovation-product-management/scripts/test_wp7_continuity_and_reports.py
          python3 product-innovation-product-management/scripts/test_wp8_evaluations.py
          python3 product-innovation-product-management/scripts/validate_wp8_coverage.py
          python3 product-innovation-product-management/scripts/test_wp9_migration.py
          python3 product-innovation-product-management/scripts/validate_pipm_consumer_migration.py
          python3 supplier-procurement-production-quality-decision/scripts/test_sppq.py
          python3 supplier-procurement-production-quality-decision/scripts/test_evaluation_catalog.py
          python3 supplier-procurement-production-quality-decision/scripts/test_guard_removal_simulations.py
          python3 supplier-procurement-production-quality-decision/scripts/test_source_mutations.py
          python3 supplier-procurement-production-quality-decision/scripts/run_evaluation_catalog.py
          python3 supplier-procurement-production-quality-decision/scripts/validate_structure_contract.py
          python3 legal-tax-intellectual-property-market-access-decision/scripts/test_object_state.py
          python3 legal-tax-intellectual-property-market-access-decision/scripts/test_input_evidence.py
          python3 legal-tax-intellectual-property-market-access-decision/scripts/test_professional_domains.py
          python3 legal-tax-intellectual-property-market-access-decision/scripts/test_decision_engine.py
          python3 legal-tax-intellectual-property-market-access-decision/scripts/test_integration_migration.py
          python3 legal-tax-intellectual-property-market-access-decision/scripts/test_release_candidate.py
          python3 legal-tax-intellectual-property-market-access-decision/scripts/validate_release_candidate.py
          python3 scripts/test_logistics_stress.py
      - name: Cross-domain and thirteen-skill expert release tests
        run: |
          python3 scripts/test_category_semantics.py
          python3 scripts/test_cross_skill_integration.py
          python3 scripts/test_domain_stress.py
          python3 scripts/test_advertising_stress.py
          python3 scripts/test_expert_release.py
          python3 scripts/test_governance.py
          python3 scripts/validate_domain_maturity.py
          python3 scripts/validate_capm_blueprint.py
          python3 scripts/validate_mbcm_blueprint.py
          python3 scripts/validate_repo.py
          python3 scripts/test_listing_conversion_stress.py
          python3 creator-affiliate-partnership-management/scripts/test_capm.py
          python3 scripts/test_mbcm_integration.py
          python3 scripts/test_statistical_primitive_parity.py
          python3 scripts/test_qoderwork_skill_installation.py
          python3 scripts/validate_release_integrity.py
          python3 scripts/test_full_repository_audit.py
          python3 -m unittest governance/interaction/tests/test_interaction_platform_connectors.py
      - name: Reject whitespace errors
        run: git diff --check
