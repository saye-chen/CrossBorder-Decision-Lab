name: Knowledge Health

on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python3 scripts/validate_knowledge_quality.py
      - run: python3 scripts/test_knowledge_quality.py
      - run: python3 governance/platform-knowledge/scripts/validate_platform_cards.py governance/platform-knowledge/cards/*.json
      - name: Build auditable health report
        if: always()
        run: python3 scripts/build_knowledge_health_report.py --output knowledge-health-report.json || true
      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: knowledge-health-report
          path: knowledge-health-report.json
